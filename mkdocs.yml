# Project information
site_name: "Technology Pattern: Pattern Name"
site_url: https://github.ibm.com/skol/lightspeed-template
site_author: John Webb
site_description: >-
    Describe the overall pattern and solution in easy to understand terms.  Include the primary products and components that make up the solution.  Also describe additional (ancillary) products that may be involved in the solution.
    
    Describe the problem that this pattern is designed to address and the value (business and user experience improvement) that the pattern is designed to address.
    
    Identify the typical outcomes for the pattern implementation and describe the proof points a client may desire to experience.
    
    Provide a brief overview that tells the reader what a typical POX experience looks like for this pattern.

# Repository
# repo_name: skol/lightspeed-template
# repo_url: https://github.ibm.com/skol/lightspeed-template

# Copyright
copyright: Copyright © 2024 IBM Client Engineering

# Configuration
theme:
  name: material
  custom_dir: material/overrides
  features:
#    - announce.dismiss
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - content.tabs.link
    - content.tooltips
    # - header.autohide
    - navigation.expand
    #- navigation.footer
    - navigation.indexes
    # - navigation.instant
    # - navigation.instant.prefetch
    # - navigation.instant.progress
    # - navigation.prune
    - navigation.sections
    # - navigation.tabs
    # - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
    # - toc.integrate
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: black
      toggle:
        icon: material/toggle-switch
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: blue
      toggle:
        icon: material/toggle-switch-off
        name: Switch to system preference

  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  favicon: https://www.ibm.com/favicon.ico
  icon:
   logo: material/home


# Plugins
plugins:
  # - blog
  - search:
      separator: '[\s\u200b\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - minify:
      minify_html: true
  - glightbox
  - classify_ibm_content:
      serve_as_persona: ibmer
#  - lightspeed_deploy_plugin

# Hooks
hooks:
  - material/overrides/hooks/shortcodes.py
  - material/overrides/hooks/translations.py

# Additional configuration
extra:
  status:
    new: Recently added
    deprecated: Deprecated
  analytics:
    provider: google
    property: !ENV GOOGLE_ANALYTICS_KEY
  homepage: https://ibm.biz/TechnologyPatterns

extra_css: # these will be common among tech patterns. Do not edit - they will be overwritten. 
   - assets/stylesheets/base.css
   - assets/stylesheets/tab.css
   - assets/stylesheets/table.css
   - assets/stylesheets/grid_cards.css
   - assets/stylesheets/picture.css
   - assets/stylesheets/colors.css

# Extensions
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      emoji_index: !!python/name:material.extensions.emoji.twemoji
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      normalize_issue_symbols: true
      repo_url_shorthand: true
      user: squidfunk
      repo: mkdocs-material
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      auto_append:
        - includes/mkdocs.md
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# Page tree
nav:
  - Overview:
    - index.md
  - Use Cases:
    - use-cases/index.md
    - Use Case One:
      - use-cases/use-case-one/index.md
      - Solution: use-cases/use-case-one/solution.md
      - Client Stories: use-cases/use-case-one/client-stories.md
      - Resources: use-cases/use-case-one/resources.md
    - Use Case Two:
      - use-cases/use-case-two/index.md
      - Solution: use-cases/use-case-two/solution.md
      - Client Stories: use-cases/use-case-two/client-stories.md
      - Resources: use-cases/use-case-two/resources.md
    - Use Case Three:
      - use-cases/use-case-three/index.md
      - Solution: use-cases/use-case-three/solution.md
      - Client Stories: use-cases/use-case-three/client-stories.md
      - Resources: use-cases/use-case-three/resources.md
  - Resources:
    - resources/index.md
  - Enablement:
    - enablement/index.md